name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
      - name: Rebuild everything from the stored model responses and confirm nothing changes
        run: |
          python scripts/generate_tickets.py
          python scripts/run_baselines.py
          python scripts/analyze_current_state.py
          python scripts/evaluate_all.py
          python scripts/score_dev_rounds.py
          python scripts/business_case.py
          git diff --exit-code -- data results
